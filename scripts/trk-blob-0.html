<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Turist Rehberliği - Sistem Testi</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* --- GENEL SAYFA YAPISI --- */
  :root {
    --primary-dark: #0f172a;       /* Lacivert Çerçeve */
    --success-bg: #ecfdf5;         /* Yeşil Arka Plan (Standart) */
    --success-border: #10b981;     /* Yeşil Kenarlık */
    --success-text: #047857;       /* Yeşil Yazı */
    --error-bg: #fef2f2;           /* Kırmızı Arka Plan (Standart) */
    --error-border: #ef4444;       /* Kırmızı Kenarlık */
    --error-text: #b91c1c;         /* Kırmızı Yazı */
    
    /* Renkler */
    --premium-green: #15803d;      /* Cevapları Gör Butonu */
    --brand-turquoise: #06b6d4;    /* Marka Turkuazı */
    --circle-bg: #e2e8f0;          /* Halka Arka Planı */
  }

  /* YENİ: Giriş Animasyonu Tanımı */
  @keyframes slideUpIn {
    0% {
      opacity: 0;
      transform: translateY(100px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-in {
    animation: slideUpIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background-color: transparent; 
    color: #334155;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 20px 0; 
    box-sizing: border-box;
  }
    
  /* --- MASAÜSTÜ KART AYARLARI --- */
  .quiz-container {
    width: 90%;              
    max-width: 500px;        
    height: 85vh;            
    height: 85dvh;            
    max-height: 800px;      
    min-height: 500px;        
    background: #ffffff;
    border-radius: 24px;    
    
    box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.3); 
    border: 1px solid rgba(0,0,0,0.05);
    
    padding: 25px 15px; 
    position: relative;
    display: flex;
    flex-direction: column; 
    justify-content: space-between; 
    box-sizing: border-box;
    transform: translateZ(0);
    will-change: transform;
    margin: auto; 
    overflow: hidden; 
  }

  /* ILELEME ÇUBUĞU */
  .progress-container {
    width: 90%; 
    margin: 0 auto 10px auto; 
    background-color: #f1f5f9;
    border-radius: 30px;
    height: 6px; 
    flex-shrink: 0;
    overflow: hidden;
    display: none; /* Başlangıçta gizli */
  }
    
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22d3ee, #0d9488);
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 30px;
  }

  .question-counter {
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 15px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
    display: none; /* Başlangıçta gizli */
  }

  /* --- INTRO (GİRİŞ) ALANI CSS --- */
  #intro-area {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .intro-slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .intro-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 15px;
    text-align: center;
    line-height: 1.3;
  }

  .intro-text {
    font-size: 0.9rem;
    color: #475569;
    line-height: 1.6;
    margin-bottom: 20px;
    text-align: center;
    padding: 0 5px;
    font-weight: 700; /* KULLANICI İSTEĞİ: Kalın Punto Eklendi */
  }

  /* iOS Tarzı Liste */
  .intro-list-container {
    flex: 1;
    overflow-y: auto;
    background: #f8fafc;
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #e2e8f0;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE */
  }
  .intro-list-container::-webkit-scrollbar { display: none; }

  .topic-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 14px 12px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 0.8rem;
    font-weight: 600;
    color: #334155;
  }
  .topic-item:last-child { border-bottom: none; }
  
  .topic-badge {
    background: #e0f2fe;
    color: #0369a1;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    white-space: nowrap;
    margin-left: 10px;
  }

  /* --- SORU ALANI --- */
  #quiz-area {
    flex: 1; 
    display: none; /* Başlangıçta gizli */
    flex-direction: column;
    justify-content: flex-start; 
    
    overflow-y: auto; 
    scrollbar-width: none; 
    -ms-overflow-style: none; 
    -webkit-overflow-scrolling: touch; 
    overscroll-behavior-y: auto; 
    
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30px, black calc(100% - 30px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 30px, black calc(100% - 30px), transparent 100%);
    
    padding-top: 20px;
    padding-bottom: 20px;
  }
   
  #quiz-area::-webkit-scrollbar { display: none; }

  .content-wrapper { 
      width: 100%; 
      margin-top: auto;
      margin-bottom: auto;
  }

  /* SORU METNİ STİLİ */
  .question-text {
    font-weight: 700; 
    font-size: 1.15rem; 
    color: #0f172a;
    line-height: 1.5;
    background-color: #f8fafc;
    border-left: 5px solid #06b6d4;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    text-align: left;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
  }

  /* --- ŞIK YAPISI --- */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 14px;              
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    padding-bottom: 5px;
  }

  .option-btn {
    position: relative;
    width: 100%;
    min-height: 64px;       
    padding: 16px 20px;
    background: #ffffff;
    border: 1px solid rgba(148, 163, 184, 0.4); 
    border-radius: 18px;  
    cursor: pointer;
    text-align: left;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    color: #475569;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    user-select: none;
    box-sizing: border-box;
    touch-action: manipulation;
  }

  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
    border-color: var(--primary-dark);
  }

  .option-btn:active { transform: scale(0.98); }

  .opt-idx {
    background: #f1f5f9;
    color: var(--primary-dark);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    margin-right: 15px;
    flex-shrink: 0;
    font-size: 0.9em;
    transition: background 0.3s, color 0.3s;
  }

  .opt-text {
    flex: 1;
    line-height: 1.4;
  }

  /* Status Icon - Başlangıçta Görünmez */
  .status-icon {
    opacity: 0;
    font-size: 1.3rem;
    transition: opacity 0.3s ease;
    margin-left: 10px;
    width: 26px; 
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* DOĞRU CEVAP CSS */
  .option-btn.correct {
    background: var(--success-bg) !important;
    border-color: var(--success-border) !important;
    color: var(--success-text) !important;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
  }
  .option-btn.correct .opt-idx {
    background: var(--success-border);
    color: #fff;
  }
  .option-btn.correct .status-icon {
    color: var(--success-text);
  }
  
  /* Sadece FA-CIRCLE-CHECK class'ı eklendiyse görünür yap. 
     Böylece sistem otomatik yeşil yaktığında ikon görünmez. */
  .option-btn .status-icon.fa-circle-check {
    opacity: 1 !important;
  }

  /* YANLIŞ CEVAP CSS */
  .option-btn.wrong {
    background: var(--error-bg) !important;
    border-color: var(--error-border) !important;
    color: var(--error-text) !important;
  }
  .option-btn.wrong .opt-idx {
    background: var(--error-border);
    color: #fff;
  }
  .option-btn.wrong .status-icon {
    opacity: 0; 
  }
  
  .options-list.mode-medium .option-btn {
    font-size: 0.85rem;         
    line-height: 1.35;        
    padding: 12px 16px;        
    min-height: 56px;
  }
  .options-list.mode-medium .opt-idx {
      width: 28px; height: 28px; font-size: 0.8em; margin-right: 10px;
  }

  .options-list.mode-compact {
    gap: 8px !important;        
  }
  .options-list.mode-compact .option-btn {
    font-size: 0.75rem;        
    line-height: 1.3;        
    padding: 10px 12px;        
    min-height: 50px;           
  }
  .options-list.mode-compact .opt-idx {
      width: 24px; height: 24px; font-size: 0.75em; margin-right: 8px;
  }

  /* BUTON ALANI (NAVIGASYON) */
  .bottom-controls {
    display: none; /* Başlangıçta gizli */
    gap: 15px; 
    margin-top: 20px; 
    flex-shrink: 0; 
    width: 100%;
    align-items: center;
  }

  .btn-action {
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  }

  .btn-action:active { transform: scale(0.95); }

  .btn-prev {
    width: 60px; 
    background-color: #f1f5f9;
    color: #475569;
    flex-shrink: 0;
    font-size: 1.2rem;
  }
  
  .btn-next {
    flex: 1; 
    background-color: #0f172a;
    color: #fff;
    font-size: 1rem;
    gap: 12px; 
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3);
  }
  
  .btn-disabled { opacity: 0.5; cursor: default; pointer-events: none; box-shadow: none; }
  
  .btn-nav {
      border: none;
      padding: 14px 20px;
      font-size: 0.95em;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      transition: transform 0.2s;
      flex: 1; 
  }
  .btn-nav:active { transform: scale(0.96); }

  .btn-review-questions {
      background-color: var(--premium-green);
      color: white;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.3);
  }

  /* --- SONUÇ ALANI --- */
  #result-area {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    text-align: center;
  }
  
  .circular-chart {
    display: block;
    margin: 10px auto;
    max-width: 80%;
    max-height: 250px;
  }
  .circle-bg {
    fill: none;
    stroke: var(--circle-bg);
    stroke-width: 2.5;
  }
  .circle {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.5s ease-out; 
  }
  .percentage {
    fill: #0f172a;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 0.6em; 
    text-anchor: middle;
  }
  .label {
    fill: #64748b;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.15em;
    text-anchor: middle;
  }

  .score-message { font-size: 1.1em; color: #64748b; line-height: 1.5; max-width: 95%; margin-top: 15px; }

  /* --- REVIEW (CEVAP ANAHTARI) ALANI --- */
  #review-area {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding-top: 10px;
  }

  .review-title {
      font-size: 1.3em;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
      flex-shrink: 0;
      border-bottom: none; 
      padding-bottom: 0;
      width: 100%;
      text-align: center;
      letter-spacing: -0.5px;
  }

  .review-scroll {
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch; 
      overscroll-behavior-y: auto; 
      touch-action: pan-y; 
      will-change: scroll-position; 
      transform: translateZ(0); 
      margin-bottom: 15px;
      padding: 10px 10px; 
      box-sizing: border-box;
      
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
  }
  .review-scroll::-webkit-scrollbar { display: none; }

  /* REVIEW CARD - AYARLAMALAR */
  .review-card {
      background: #ffffff;
      border-radius: 20px; 
      padding: 24px;
      margin-bottom: 20px;
      text-align: left;
      position: relative;
      border: 1px solid transparent; 
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: transform 0.2s ease;
      
      border-left-width: 6px;
      border-left-style: solid;
      border-left-color: transparent; 
  }

  /* GÜNCELLENEN KISIM: Arka planlar 100-150 seviyesine çekildi, Gölge %0.45 yapıldı */
  .review-card.is-correct {
      background: #d1fae5; /* 100-150 seviyesi (Emerald 100) */
      border-color: #d1fae5; 
      border-left-color: #10b981; 
      box-shadow: 0 10px 30px -10px rgba(34, 197, 94, 0.45); /* Gölge opaklı�
